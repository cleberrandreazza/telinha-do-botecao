[package]
name = "telinha-do-botecao"
version = "0.1.3"
description = "Telinha do Botecao para Windows"
edition = "2021"
rust-version = "1.77"

[lib]
name = "telinha_do_botecao_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "net", "rt", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
xcap = "0.6"
windows-capture = "2.0"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"
cpal = "0.15"
sysinfo = "0.33"
windows-core = "0.61.2"
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
] }
